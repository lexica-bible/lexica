# Dependabot — GitHub's built-in dependency watcher.
# Opens a pull request when a Python or Node package you use has an update
# (security fixes get flagged automatically). Zero maintenance after this.
#
# Grouping: related bumps arrive as ONE pull request instead of several.
#   - pip: minor/patch updates batched together. A MAJOR bump still comes on its
#          own so you can eyeball a big jump before merging.
#   - npm: all @babel/* packages move as one PR — they're a matched set, and a
#          major bump (7 -> 8) has to go together or the build breaks.
#   - github-actions: batched together.
#
# Skipped on purpose (2026-10-25) — each would need a deliberate change, not a bot PR:
#   - googlenewsdecoder: pinned at 0.1.7 (the version on PA). The hard time stop in
#          scripts/news/gnews_resolve.py + deadline.py was built against it, and CI never
#          installs it, so a green bot PR proves nothing. Re-pin by hand after testing.
#   - @babel/* majors (8+): Babel 8 compiles the page code differently — the built
#          app.js starts with an `import` line and the site loads blank.
#   - react / react-dom majors (19+): the site loads React from its own copies in
#          static/ (React 18). React 19 no longer ships that kind of file at all.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "googlenewsdecoder"
    groups:
      python-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      babel:
        patterns:
          - "@babel/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
